esphome:
  name: lilygo-t5-47-plus-deep-sleep
  friendly_name: LILYGO T5 4.7 Plus Deep Sleep
  includes:
    - <driver/rtc_io.h>
  on_boot:
    - priority: -100
      then:
        - component.update: epaper
    - priority: 600
      then:
        - lambda: |-
            rtc_gpio_init(GPIO_NUM_21);
            rtc_gpio_set_direction(GPIO_NUM_21, RTC_GPIO_MODE_INPUT_ONLY);
            rtc_gpio_pullup_en(GPIO_NUM_21);
            rtc_gpio_pulldown_dis(GPIO_NUM_21);

packages:
  lilygo_t5_47_plus: github://hbast/lilygo_t5_47_plus/packages/lilygo_t5_47_plus.yaml@v1.0.0

logger:
  hardware_uart: USB_SERIAL_JTAG

display:
  - platform: lilygo_t5_47_plus
    id: epaper
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);
      it.rectangle(20, 20, 920, 500, COLOR_ON);
      it.circle(480, 270, 120, COLOR_ON);

deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 5min
  esp32_ext1_wakeup:
    pins:
      - GPIO21
    mode: ANY_LOW
